/* 三塊木板文字（僅在 OK 狀態顯示查到的 倉別/料號/數量） */
.board-text {
  position: absolute;
  left: 56%;
  width: 36%;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  opacity: 0;
  transition: opacity 0.2s ease-in-out;
  pointer-events: none;
}
#stage-wrap { position: relative; }
#board1 { top: 48.3%; height: 8%; }
#board2 { top: 58.5%; height: 10%; }
#board3 { top: 70.3%; height: 8%; }
.board-label {
  display: none; /* 不顯示表頭文字，只顯示數值本身 */
}
.board-panel {
  display: inline-block;
  max-width: 100%;
  padding: 1px 4px;
}
.board-value {
  display: block;
  font-weight: 800;
  color: #111;
  font-size: 4vw;
  line-height: 1.2;
  white-space: nowrap;
  -webkit-text-stroke: 2.5px #fff;
  paint-order: stroke fill;
  text-shadow:
    -1.5px -1.5px 0 #fff,
     1.5px -1.5px 0 #fff,
    -1.5px  1.5px 0 #fff,
     1.5px  1.5px 0 #fff,
     0      2px   3px rgba(0,0,0,0.25);
}
#stage.filled .board-text { opacity: 1; }

/* 底部 SN 輸入框：直接疊在圖片預留的白色橫條上，刷入/輸入/顯示都在同一格 */
#sn-input {
  position: absolute;
  left: 22%;
  width: 60%;
  top: 93.6%;
  height: 4.4%;
  border: none;
  background: transparent;
  font-weight: bold;
  letter-spacing: 1px;
  color: #111;
  font-size: 3.2vw;
  padding: 0 1%;
  text-align: left;
}
#sn-input:focus { outline: none; background: rgba(255,255,150,0.3); }
.btn-cam-onstage {
  position: absolute;
  left: 84%;
  width: 14%;
  top: 92.8%;
  height: 5.2%;
  background: #00bcd4;
  color: white;
  border: none;
  border-radius: 5px;
  font-size: 2.3vw;
  padding: 0;
}

/* NG 狀態下的查無資料提示（疊在圖片中段空白處） */
#ng-msg {
  position: absolute;
  left: 8%;
  right: 8%;
  top: 40%;
  text-align: center;
  font-size: 5vw;
  font-weight: bold;
  color: #b71c1c;
  text-shadow: 0 2px 6px rgba(255,255,255,0.85), 0 0 3px #fff;
  opacity: 0;
  transition: opacity 0.2s ease-in-out;
  pointer-events: none;
}
#stage.state-ng.filled #ng-msg { opacity: 1; }

/* ============================================================
 * 掃描輸入區
 * ============================================================ */
#input-panel {
  max-width: 480px;
  margin: 14px auto 0;
  padding: 0 10px 20px;
}
#btn-query {
  width: 100%;
  margin-top: 8px;
  padding: 12px;
  font-size: 16px;
  font-weight: bold;
  background: #4CAF50;
  color: white;
  border: none;
  border-radius: 8px;
}
#status-line {
  text-align: center;
  margin-top: 8px;
  font-size: 14px;
  min-height: 18px;
  color: #ddd;
}

/* 相機 Modal 相關 CSS 樣式（沿用原系統） */
.camera-modal-overlay {
  display: none;
  position: fixed;
  top: 0; left: 0; width: 100%; height: 100%;
  background: rgba(0, 0, 0, 0.85);
  z-index: 9999;
  overflow-y: auto;
}
.camera-modal-content {
  position: relative;
  max-width: 480px;
  margin: 4% auto;
  background: #ffffff;
  padding: 20px;
  border-radius: 12px;
  box-shadow: 0 4px 20px rgba(0,0,0,0.3);
}
.camera-video-container {
  width: 100%; height: 260px;
  background-color: #000000;
  border-radius: 8px;
  overflow: hidden;
  position: relative;
  margin-top: 12px;
}
.camera-video-container video { width: 100%; height: 100%; object-fit: cover; }
.scanner-laser {
  position: absolute; top: 10%; left: 5%; width: 90%; height: 2px;
  background-color: red; box-shadow: 0 0 8px red; z-index: 10;
  animation: scan 2s infinite linear;
}
@keyframes scan { 0% { top: 10%; } 50% { top: 90%; } 100% { top: 10%; } }
.scanner-guide-box {
  position: absolute; top: 32%; left: 8%; width: 84%; height: 36%;
  border: 3px solid #00e676; border-radius: 8px;
  box-shadow: 0 0 0 2000px rgba(0,0,0,0.35);
  z-index: 9; pointer-events: none;
}
.zoom-slider-row { display: none; align-items: center; gap: 8px; margin-top: 8px; font-size: 13px; }
.zoom-slider-row input[type="range"] { flex: 1; }
.btn-camera-tool {
  flex: 1; background-color: #37474f; color: white; padding: 10px;
  font-size: 14px; border-radius: 6px; border: none;
}
.btn-camera-close {
  margin-top: 10px; width: 100%; padding: 12px;
  background-color: #ff4d4f; color: white; border: none;
  border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer;
}
.btn-take-photo { width: 100%; background: #2196F3; color: white; padding: 14px; font-size: 16px; border: none; border-radius: 6px; }
.btn-try-live { width: 100%; margin-top: 10px; background: #607d8b; color: white; padding: 10px; font-size: 13px; border: none; border-radius: 6px; }
.camera-status-box { background: #f1f5f9; border-radius: 8px; padding: 12px; text-align: center; margin: 10px 0; }
</style>
</head>
<body>

<div id="stage-wrap">
  <div id="stage" class="state-ok">
    <div id="board1" class="board-text">
      <span class="board-label">倉別</span>
      <span class="board-panel"><span id="board1-val" class="board-value"></span></span>
    </div>
    <div id="board2" class="board-text">
      <span class="board-label">料號</span>
      <span class="board-panel"><span id="board2-val" class="board-value"></span></span>
    </div>
    <div id="board3" class="board-text">
      <span class="board-label">數量</span>
      <span class="board-panel"><span id="board3-val" class="board-value"></span></span>
    </div>
    <div id="ng-msg">查無資料</div>

    <!-- SN 輸入框直接疊在圖片預留的白色橫條上：可手動輸入，也可用旁邊相機按鈕掃描 -->
    <input type="text" id="sn-input" placeholder="請刷入或輸入SN" autocomplete="off"
           oninput="autoSizeSNInput(this.value)"
           onkeydown="if(event.key==='Enter'){ event.preventDefault(); queryBySN(); }"
           onfocus="this.select()">
    <button type="button" class="btn-cam-onstage" onclick="openCameraModal('sn-input')">📷</button>
  </div>

  <div id="input-panel">
    <button type="button" id="btn-query" onclick="queryBySN()">查詢</button>
    <div id="status-line"></div>
  </div>
</div>

<!-- 相機彈窗 Modal 模組（沿用原系統的拍照精準掃描 + 即時鏡頭預覽） -->
<div id="camera-modal" class="camera-modal-overlay">
  <div class="camera-modal-content">
    <h3 style="margin: 0; text-align: left;">📷 拍照條碼掃描</h3>
    <p style="font-size:13px; color:#555;">對準條碼即可自動辨識，不需每次拍照。若裝置/瀏覽器不支援即時預覽，請改按下方「拍照掃描」按鈕。</p>

    <div class="camera-status-box">
      <p id="camera-status-text" style="margin:0; font-size:14px;"></p>
    </div>

    <button type="button" class="btn-take-photo" onclick="triggerManualCapture()">📸 開啟相機拍照掃描</button>
    <button type="button" class="btn-try-live" onclick="tryLivePreview()">嘗試即時鏡頭預覽（進階／部分環境支援）</button>

    <div class="camera-video-container" id="live-preview-box" style="display:none;">
      <div class="scanner-guide-box"></div>
      <div class="scanner-laser"></div>
      <video id="scanner-video" playsinline autoplay muted></video>
      <canvas id="scanner-canvas" style="display:none;"></canvas>
    </div>
    <div class="zoom-slider-row" id="zoom-slider-row">
      <span>🔍 數位變焦</span>
      <input type="range" id="zoom-slider" min="1" max="1" step="0.1" value="1" oninput="applyZoom(this.value)">
    </div>
    <button type="button" id="btn-torch" class="btn-camera-tool" onclick="toggleTorch()" style="display:none; width:100%; margin-top:8px;">💡 手電筒</button>

    <input type="file" id="manual-capture-input" accept="image/*" capture="environment" style="display:none;" onchange="handleManualCaptureFile(this)">
    <div id="manual-decode-holder" style="display:none;"></div>

    <button type="button" class="btn-camera-close" onclick="closeCameraModal()">關閉相機</button>
  </div>
</div>

<script>
/* ============================================================
 * 🔧 請改成你「部署 Apps Script 為網頁應用程式」後拿到的網址
 * ============================================================ */
const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxkQsFH6J2a-l5802Gt5X-us9M8KC3q0NUwN76BbrOIjYzaCax0W6acV22uRuJSLMJ-/exec';

function callAppsScript_(fnName, args) {
  return fetch(APPS_SCRIPT_URL, {
    method: 'POST',
    // 用 text/plain 避免瀏覽器送出 CORS 預檢(OPTIONS)，Apps Script 網頁應用程式不支援預檢請求
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify({ fn: fnName, args: args })
  }).then(function(res) {
    if (!res.ok) throw new Error('HTTP ' + res.status);
    return res.json();
  });
}

/* ============================================================
 * 查詢主流程
 * ============================================================ */
function setStatus(text, color) {
  const el = document.getElementById('status-line');
  el.innerText = text;
  el.style.color = color || '#ddd';
}

// 自動縮小字級直到容器塞得下，避免長料號/長SN爆版
function fitTextToWidth(el, maxFontVwBase) {
  const container = el.closest('.board-panel') || el.parentElement;
  let fontPx = parseFloat(getComputedStyle(el).fontSize);
  let guard = 0;
  while (el.scrollWidth > container.clientWidth - 4 && fontPx > 9 && guard < 40) {
    fontPx -= 1;
    el.style.fontSize = fontPx + 'px';
    guard++;
  }
}

// SN 輸入框（疊在圖片上）依字數多寡自動縮小字級，避免長序號爆版
function autoSizeSNInput(text) {
  const el = document.getElementById('sn-input');
  const len = String(text || '').length;
  let vw;
  if (len <= 12) vw = 3.2;
  else if (len <= 18) vw = 2.6;
  else if (len <= 24) vw = 2.1;
  else vw = 1.7;
  el.style.fontSize = vw + 'vw';
}

function refitAllBoards() {
  requestAnimationFrame(() => {
    ['board1-val', 'board2-val', 'board3-val'].forEach(id => {
      const el = document.getElementById(id);
      el.style.fontSize = ''; // 先重設回 CSS 預設值再重新量測
      fitTextToWidth(el);
    });
  });
}

function showBoards(warehouse, partNo, qty, sn) {
  const stage = document.getElementById('stage');
  stage.classList.remove('state-ng');
  stage.classList.add('state-ok');
  document.getElementById('board1-val').innerText = warehouse;
  document.getElementById('board2-val').innerText = partNo;
  document.getElementById('board3-val').innerText = (qty === '' || qty === null || qty === undefined) ? '-' : qty;
  stage.classList.add('filled');
  refitAllBoards();
}

function showNG(sn) {
  const stage = document.getElementById('stage');
  stage.classList.remove('state-ok');
  stage.classList.add('state-ng');
  stage.classList.add('filled');
}

function queryBySN() {
  const input = document.getElementById('sn-input');
  const sn = input.value.trim().toUpperCase();
  if (!sn) {
    setStatus('請先輸入或刷入 SN！', '#ffcc80');
    return;
  }
  input.value = sn;
  autoSizeSNInput(sn);
  setStatus('查詢中...', '#ddd');
  const btn = document.getElementById('btn-query');
  btn.disabled = true;

  callAppsScript_('queryBySNBoard', [sn])
    .then(function(res) {
      btn.disabled = false;
      if (!res.success) {
        setStatus(res.msg || '查詢失敗', '#ff8a80');
        return;
      }
      if (res.found) {
        showBoards(res.warehouse, res.partNo, res.qty, res.sn);
        setStatus('✅ 查到資料', '#a5d6a7');
      } else {
        showNG(res.sn);
        setStatus('❌ 查無此 SN 對應的資料', '#ff8a80');
      }
      // SN 保留顯示在圖片上的輸入框中，方便核對；下一次刷入/輸入會自動覆蓋
    })
    .catch(function(err) {
      btn.disabled = false;
      setStatus('連線失敗：' + err.message, '#ff8a80');
    });
}

/* ============================================================
 * 相機 / 條碼掃描模組（原樣沿用自倉儲管理系統，僅簡化為單一輸入目標）
 * 拍照掃描：<input type="file" capture="environment"> 呼叫原生相機 App，
 * 不受任何 iframe 權限限制；即時鏡頭預覽為進階備援方式。
 * ============================================================ */
let mediaStream = null;
let scanInterval = null;
let zxingReader = null;
let currentTrack = null;
let torchOn = false;

function playBeep() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = ctx.createOscillator();
    osc.type = "sine";
    osc.frequency.setValueAtTime(800, ctx.currentTime);
    osc.connect(ctx.destination);
    osc.start();
    osc.stop(ctx.currentTime + 0.15);
  } catch (e) {}
}

function setCameraStatus(text) {
  const el = document.getElementById('camera-status-text');
  if (el) el.innerText = text;
}

function handleScannedResult(scannedText) {
  playBeep();
  if (navigator.vibrate) { try { navigator.vibrate(80); } catch (e) {} }
  const input = document.getElementById('sn-input');
  input.value = String(scannedText).trim().toUpperCase();
  closeCameraModal();
  queryBySN();
}

function openCameraModal(targetInputId) {
  const modal = document.getElementById("camera-modal");
  modal.style.display = "block";
  document.getElementById('btn-torch').style.display = 'none';
  document.getElementById('live-preview-box').style.display = 'none';
  document.getElementById('zoom-slider-row').style.display = 'none';
  setCameraStatus('請選擇下方任一種掃描方式');
  tryLivePreview();
}

async function tryLivePreview() {
  if (!window.isSecureContext) {
    alert('目前網址非 https，無法使用即時鏡頭預覽，請改用拍照掃描。');
    return;
  }
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    setCameraStatus('此瀏覽器不支援即時鏡頭預覽，請改用拍照掃描。');
    return;
  }

  setCameraStatus('正在嘗試開啟即時鏡頭...');
  const liveBox = document.getElementById('live-preview-box');
  liveBox.style.display = 'block';
  const video = document.getElementById('scanner-video');

  try {
    try {
      mediaStream = await navigator.mediaDevices.getUserMedia({
        video: {
          facingMode: { ideal: "environment" },
          width: { ideal: 1920 },
          height: { ideal: 1080 },
          advanced: [{ focusMode: "continuous" }]
        }
      });
    } catch (e1) {
      try {
        mediaStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
      } catch (e2) {
        mediaStream = await navigator.mediaDevices.getUserMedia({ video: true });
      }
    }

    video.srcObject = mediaStream;
    await new Promise((resolve) => {
      video.onloadedmetadata = () => { video.play().then(resolve).catch(resolve); };
    });

    currentTrack = mediaStream.getVideoTracks()[0];
    try {
      const caps = currentTrack.getCapabilities ? currentTrack.getCapabilities() : {};
      if (caps && caps.torch) document.getElementById('btn-torch').style.display = 'inline-block';
      if (caps && caps.focusMode && caps.focusMode.indexOf('continuous') !== -1) {
        try { await currentTrack.applyConstraints({ advanced: [{ focusMode: 'continuous' }] }); } catch (e) {}
      }
      if (caps && caps.zoom && caps.zoom.max > caps.zoom.min) {
        const zoomSlider = document.getElementById('zoom-slider');
        zoomSlider.min = caps.zoom.min;
        zoomSlider.max = caps.zoom.max;
        zoomSlider.step = caps.zoom.step || 0.1;
        zoomSlider.value = caps.zoom.min;
        document.getElementById('zoom-slider-row').style.display = 'flex';
      }
    } catch (e) {}

    const canvas = document.getElementById('scanner-canvas');
    const ctx = canvas.getContext('2d', { willReadFrequently: true });
    let isDetecting = false;

    function captureGuideBoxFrame() {
      const vw = video.videoWidth, vh = video.videoHeight;
      if (!vw || !vh) return null;
      const sx = vw * 0.08, sy = vh * 0.32, sw = vw * 0.84, sh = vh * 0.36;
      const UPSCALE = 2;
      canvas.width = sw * UPSCALE;
      canvas.height = sh * UPSCALE;
      ctx.drawImage(video, sx, sy, sw, sh, 0, 0, canvas.width, canvas.height);
      return canvas;
    }

    if ('BarcodeDetector' in window) {
      setCameraStatus('即時鏡頭已啟動，請對準條碼');
      const barcodeDetector = new BarcodeDetector({
        formats: ['code_128', 'code_39', 'code_93', 'ean_13', 'ean_8', 'upc_a', 'upc_e', 'itf', 'qr_code', 'data_matrix', 'pdf417']
      });
      scanInterval = setInterval(async () => {
        if (isDetecting) return;
        if (video.readyState !== video.HAVE_ENOUGH_DATA) return;
        const frame = captureGuideBoxFrame();
        if (!frame) return;
        isDetecting = true;
        try {
          const barcodes = await barcodeDetector.detect(frame);
          if (barcodes.length > 0) { handleScannedResult(barcodes[0].rawValue); return; }
        } catch (e) { console.error(e); } finally { isDetecting = false; }
      }, 280);
    } else if (typeof ZXing !== 'undefined') {
      setCameraStatus('即時鏡頭已啟動（相容模式），請對準條碼');
      zxingReader = new ZXing.BrowserMultiFormatReader();
      if (typeof zxingReader.decodeFromCanvas === 'function') {
        scanInterval = setInterval(async () => {
          if (isDetecting) return;
          if (video.readyState !== video.HAVE_ENOUGH_DATA) return;
          const frame = captureGuideBoxFrame();
          if (!frame) return;
          isDetecting = true;
          try {
            const result = zxingReader.decodeFromCanvas(frame);
            if (result) handleScannedResult(result.getText());
          } catch (e) {} finally { isDetecting = false; }
        }, 280);
      } else {
        zxingReader.decodeFromVideoDevice(null, 'scanner-video', (result, err) => {
          if (result) handleScannedResult(result.getText());
        });
      }
    } else {
      setCameraStatus('此瀏覽器不支援即時鏡頭辨識，請改用拍照掃描。');
    }
  } catch (err) {
    console.error("即時相機啟動錯誤:", err);
    setCameraStatus('無法啟動鏡頭，請改用拍照掃描。');
    liveBox.style.display = 'none';
  }
}

function applyZoom(value) {
  if (!currentTrack) return;
  currentTrack.applyConstraints({ advanced: [{ zoom: Number(value) }] }).catch(() => {});
}

function toggleTorch() {
  if (!currentTrack) return;
  torchOn = !torchOn;
  currentTrack.applyConstraints({ advanced: [{ torch: torchOn }] }).catch(() => {
    torchOn = !torchOn;
    alert('此裝置不支援手電筒功能');
  });
}

function triggerManualCapture() {
  const input = document.getElementById('manual-capture-input');
  input.value = '';
  input.click();
}

function handleManualCaptureFile(fileInputEl) {
  const file = fileInputEl.files && fileInputEl.files[0];
  if (!file) return;
  setCameraStatus('辨識中...');

  if (typeof Html5Qrcode === 'undefined') {
    alert('掃描元件仍在載入中，請稍候再試一次');
    return;
  }
  if (!window._manualQrInstance) {
    window._manualQrInstance = new Html5Qrcode("manual-decode-holder", {
      experimentalFeatures: { useBarCodeDetectorIfSupported: true }
    });
  }

  window._manualQrInstance.scanFile(file, true)
    .then(decodedText => { handleScannedResult(decodedText); })
    .catch(err => {
      console.error('第一次辨識失敗，嘗試裁切放大中央區域再重試一次:', err);
      retryDecodeWithCenterCrop(file);
    });
}

function retryDecodeWithCenterCrop(file) {
  const img = new Image();
  const objectUrl = URL.createObjectURL(file);
  img.onload = () => {
    try {
      const cropRatio = 0.7;
      const sx = img.width * (1 - cropRatio) / 2;
      const sy = img.height * (1 - cropRatio) / 2;
      const sw = img.width * cropRatio;
      const sh = img.height * cropRatio;
      const canvas = document.createElement('canvas');
      const UPSCALE = 1.6;
      canvas.width = sw * UPSCALE;
      canvas.height = sh * UPSCALE;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, sx, sy, sw, sh, 0, 0, canvas.width, canvas.height);
      canvas.toBlob(blob => {
        URL.revokeObjectURL(objectUrl);
        if (!blob) { setCameraStatus('辨識失敗，請重新拍照'); return; }
        const croppedFile = new File([blob], 'crop.jpg', { type: 'image/jpeg' });
        window._manualQrInstance.scanFile(croppedFile, true)
          .then(decodedText => { handleScannedResult(decodedText); })
          .catch(err2 => { console.error(err2); setCameraStatus('辨識失敗，請重新拍照'); });
      }, 'image/jpeg', 0.92);
    } catch (e) {
      URL.revokeObjectURL(objectUrl);
      setCameraStatus('辨識失敗，請重新拍照');
    }
  };
  img.onerror = () => { URL.revokeObjectURL(objectUrl); setCameraStatus('辨識失敗，請重新拍照'); };
  img.src = objectUrl;
}

function closeCameraModal() {
  if (scanInterval) { clearInterval(scanInterval); scanInterval = null; }
  if (zxingReader) { try { zxingReader.reset(); } catch (e) {} zxingReader = null; }
  if (mediaStream) { mediaStream.getTracks().forEach(track => track.stop()); mediaStream = null; }
  currentTrack = null;
  torchOn = false;

  const zoomRow = document.getElementById('zoom-slider-row');
  if (zoomRow) zoomRow.style.display = 'none';

  const video = document.getElementById('scanner-video');
  if (video) { video.pause(); video.srcObject = null; }

  const liveBox = document.getElementById('live-preview-box');
  if (liveBox) liveBox.style.display = 'none';

  const modal = document.getElementById("camera-modal");
  if (modal) modal.style.display = "none";
}
</script>
</body>
